name: Deploy

# push 到 master 自动构建并发布到 Cloudflare Worker（remind.taojun.top）。
# 凭据：cloudflare API Token 存在仓库 secret「CLOUDFLARE_API_TOKEN」。
# 不使用本机 wrangler 的 OAuth 登录态——那玩意儿会过期，过期后 CI 直接挂，
# 而且开源后别人根本无法复现。
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.env.production'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    # 🔒 安全门禁：本 job 跑在 self-hosted runner（即生产服务器本身）。
    # 仓库一旦公开，攻击者可通过 fork + PR 让你的服务器执行其代码。
    # 这里强制只允许本仓库（owner 自己的分支）触发，外部 fork/PR 一律跳过。
    if: github.repository_owner == 'CheeseTJ'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false # 保留 node_modules 加速构建

      - name: Build + Deploy（remind.taojun.top）
        env:
          # 走 API Token 而非本机 OAuth，凭据来源显式且可复现
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 账号 ID 不再写进 wrangler.jsonc（仓库公开），由 secret 注入
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export PATH=/usr/local/bin:$PATH
          npm ci --no-audit --no-fund
          npm run deploy

      - name: Smoke test
        run: curl -sf --max-time 15 https://remind.taojun.top/ > /dev/null
