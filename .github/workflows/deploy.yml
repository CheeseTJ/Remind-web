name: Deploy

# push 到 master 自动构建并发布到 Cloudflare Worker（remind.taojun.top）。
# wrangler 使用本机已登录的 OAuth 凭据（与 Ucenter/music 部署同一方式）。
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.env.production'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    # 🔒 安全门禁：本 job 跑在 self-hosted runner（即生产服务器本身）。
    # 仓库一旦公开，攻击者可通过 fork + PR 让你的服务器执行其代码。
    # 这里强制只允许本仓库（owner 自己的分支）触发，外部 fork/PR 一律跳过。
    if: github.repository_owner == 'CheeseTJ'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false # 保留 node_modules 加速构建

      - name: Build + Deploy（remind.taojun.top）
        run: |
          export PATH=/usr/local/bin:$PATH
          npm ci --no-audit --no-fund
          npm run deploy
